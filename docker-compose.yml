services:
  mongodb:
    image: mongo:6.0
    container_name: skybound_mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - skybound_network
    restart: always

  backend:
    build: ./backend
    container_name: skybound_backend
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - skybound_network
    restart: always

  frontend:
    build: ./frontend
    container_name: skybound_frontend
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - skybound_network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: skybound_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - skybound_network
    restart: always

networks:
  skybound_network:
    driver: bridge

volumes:
  mongodb_data:
