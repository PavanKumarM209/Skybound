services:
  mongodb:
    image: mongo:6.0
    container_name: skybound_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - skybound_network
    restart: always

  backend:
    build: ./backend
    container_name: skybound_backend
    environment:
      - MONGO_URI=mongodb://mongodb:27017/skybound
      - PORT=5000
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
    networks:
      - skybound_network
    restart: always

  frontend:
    build: ./frontend
    container_name: skybound_frontend
    environment:
      - PORT=3000
      - WATCHPACK_POLLING=true # Helps with dev-server reload in Docker
      - BACKEND_URL=http://backend:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - skybound_network
    restart: always

  ngrok:
    image: ngrok/ngrok:latest
    container_name: skybound_ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http frontend:3000
    depends_on:
      - frontend
    networks:
      - skybound_network
    ports:
      - "4041:4040"
    restart: always

networks:
  skybound_network:
    driver: bridge

volumes:
  mongodb_data:
